{% set name = "simple-salesforce" %}
{% set version = "1.12.10" %}
{% set deselect_tests = " --deselect=simple_salesforce/tests/test_login.py::TestSalesforceLogin::test_connected_app_login_failure" %}
{% set deselect_tests = 'deselect_tests + " --deselect=simple_salesforce/tests/test_login.py::TestSalesforceLogin::test_token_login_failure"' %}
{% set deselect_tests = 'deselect_tests + " --deselect=simple_salesforce/tests/test_bulk2.py::TestSFBulk2Type::test_get_failed_record_results"' %}  # [win]
{% set deselect_tests = 'deselect_tests + " --deselect=simple_salesforce/tests/test_bulk2.py::TestSFBulk2Type::test_get_unprocessed_record_results"' %}  # [win]
{% set deselect_tests = 'deselect_tests + " --deselect=simple_salesforce/tests/test_bulk2.py::TestSFBulk2Type::test_hard_delete"' %}  # [win]
{% set deselect_tests = 'deselect_tests + " --deselect=simple_salesforce/tests/test_bulk2.py::TestSFBulk2Type::test_insert"' %}  # [win]
{% set deselect_tests = 'deselect_tests + " --deselect=simple_salesforce/tests/test_bulk2.py::TestSFBulk2Type::test_upsert"' %}  # [win]

# > raise TypeError("auth_message must be a string")
# E TypeError: auth_message must be a string
# E PermissionError: [WinError 32] The process cannot access the file because it is being used by another process
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e3cb171c8369503843c994b0b6209c405c5678bb90be00f01ea9561466de49a2

build:
  number: 0
  script: python -m pip install --no-deps --ignore-installed . --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - setuptools >=61.0
  run:
    - python
    - requests >=2.22.0
    - typing-extensions
    - zeep
    - pyjwt
    - more-itertools
    - typing_extensions

test:
  source_files:
    # pyargs does not work, tests removed from site-package dir.
    - simple_salesforce
  imports:
    - simple_salesforce
  commands:
    - pip check
    - pytest -v simple_salesforce/tests {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - responses >=0.5.1
    - cryptography >4.0.0

about:
  home: https://github.com/simple-salesforce/simple-salesforce
  dev_url: https://github.com/simple-salesforce/simple-salesforce
  description: A very simple Salesforce.com REST API client for Python
  summary: Simple Salesforce is a basic Salesforce.com REST API client. The goal is to provide a very low-level interface to the API, returning an ordered dictionary of the API JSON response.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  doc_url: https://simple-salesforce.readthedocs.io

extra:
  recipe-maintainers:
    - mariusvniekerk
